[package]
name = "dotfm"
version = "5.0.0"
edition = "2024"
description = "A Rust-based command-line tool for dotfiles management with profiles."
authors = ["Alexandre Trotel"]
documentation = "https://docs.rs/dotfm"
repository = "https://github.com/alexandretrotel/dotfm"
homepage = "https://github.com/alexandretrotel/dotfm"
license = "GPL-3.0-or-later"
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "CHANGELOG.md"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:rpassword", "dep:color-eyre"]

[lib]
name = "dotfm"

[[bin]]
name = "dotfm"
path = "src/bin/dotfm/main.rs"
required-features = ["cli"]

[dependencies]
age = "0.12"
color-eyre = { version = "0.6", default-features = false, optional = true }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rpassword = { version = "7.4", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
directories-next = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
thiserror = "2.0"
keyring-core = "1.0"
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }
